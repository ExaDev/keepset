name: Pages

# Builds the static site (site/, from the catalogue the package bundles) and publishes it to GitHub Pages. The build runs on the resolved runner like every CI job; the deploy job holds the only write permissions in this workflow, pages and id-token, which deploy-pages needs and nothing else, and never needs write access to the repository's contents.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and a newer push supersedes a queued one rather than both publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm run site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Deliberately a GitHub-hosted runner: the deployment talks only to GitHub's Pages API, and keeping the job that holds the Pages token off the self-hosted fleet matches the release job's reasoning.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to publish the uploaded artifact as the Pages site
      id-token: write # deploy-pages proves the deployment's origin with an OIDC token
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
